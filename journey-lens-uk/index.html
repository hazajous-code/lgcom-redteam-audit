<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="디지털 미스터리 쇼퍼 제안 프레임과 LG.com UK 사업부별·TV 심층 진단 결과">
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Journey Lens UK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one reading column, top-to-bottom argument — 결론 → 근거 3개 → 원인 → 과제 → 다음 단계 → 부록(입력). White, single light theme by request. Readability: Noto Sans KR 16px / 1.75, high-contrast ink. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F6F5F7; --line:#E3E0E6; --line-2:#CFCAD3;
  --ink:#141216; --ink-2:#36323A; --muted:#5C5661;
  --accent:#A50034; --accent-soft:#FBEFF3;
  --good:#18693C; --good-soft:#E5F3EA; --warn:#7F5300; --warn-soft:#FCF3E1; --crit:#A8231B; --crit-soft:#FCE8E6;
  --font-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-data:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.75;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.num{letter-spacing:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent);text-underline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:10px;overflow-x:auto}
.logo{font-weight:700;white-space:nowrap;letter-spacing:-.01em}
.logo span{color:var(--accent)}
nav.toc{display:flex;gap:2px}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:14px;padding:6px 10px;border-radius:6px}
nav.toc a:hover{background:var(--soft)}
nav.toc a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.toc a b{font-family:var(--font-data);font-weight:500;color:var(--muted);margin-right:4px;font-size:11px}
section{padding-block:44px;border-bottom:1px solid var(--line);scroll-margin-top:118px}
section:last-of-type{border-bottom:0}
.step{font-family:var(--font-data);font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.01em;margin-bottom:6px}
h1{font-size:32px;line-height:1.35;letter-spacing:-.02em;margin:0 0 12px;text-wrap:balance;max-width:24ch}
h2{font-size:24px;line-height:1.4;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
h3{font-size:16.5px;margin:0 0 8px;line-height:1.5}
.lede{color:var(--ink-2);max-width:70ch;margin:0 0 24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-bottom:28px}
.meta b{color:var(--ink);font-weight:600}
.claims{display:grid;gap:12px;counter-reset:c}
.claim{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;border:1px solid var(--line);border-radius:10px}
.claim .n{font-family:var(--font-data);font-size:22px;font-weight:700;color:var(--accent);line-height:1.2}
.claim h3{font-size:17.5px;margin:0 0 4px;line-height:1.5}
.claim p{margin:0;color:var(--ink-2);font-size:15px}
.claim a.go{font-size:14px;white-space:nowrap;text-decoration:none}
.status3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.status3>div{background:var(--soft);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)}.p-part{background:var(--warn-soft);color:var(--warn)}.p-no{background:var(--crit-soft);color:var(--crit)}.p-hyp{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .v{font-family:var(--font-data);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted)}
.kpi .l{font-size:14px;font-weight:700}
.kpi .d{font-size:13.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.6}
th{font-size:12.5px;letter-spacing:.02em;color:var(--muted);font-weight:600;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.lg td{background:var(--accent-soft)}
tr.hl td{background:#FFFBEF}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:14px 18px;border-radius:0 8px 8px 0;margin:20px 0;font-size:15px;color:var(--ink-2)}
.callout b{color:var(--ink)}
.caveat{border-left:3px solid var(--warn);background:var(--warn-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0;font-size:14px;color:var(--ink-2)}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--accent);display:inline-block;vertical-align:-1px}
.dot.R{background:var(--accent)}.dot.M{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.L{border-color:var(--muted)}.dot.N{border-color:var(--line-2);background:var(--soft)}.dot.E{border:1px dashed var(--line-2)}
.yr{font-family:var(--font-data);font-size:12.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--ink-2);white-space:nowrap}
.yr.old{background:var(--crit-soft);color:var(--crit)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.cmp{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr);font-size:14.5px}
.cmp>div{padding:8px 6px;border-bottom:1px solid var(--line);min-width:0}
.cmp .h{font-weight:700;font-size:13px;color:var(--muted)}
.cmp .k{color:var(--muted)}
.cmp .bad{color:var(--crit);font-weight:600}
.cmp.two-col{grid-template-columns:120px minmax(0,1fr)}
.causes{display:grid;gap:14px}
.cause{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cause summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;padding:16px 18px;align-items:start}
.cause summary::-webkit-details-marker{display:none}
.cause summary:hover{background:var(--soft)}
.cause summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cause .ltr{font-family:var(--font-data);font-size:20px;color:var(--accent);font-weight:700}
.cause h3{margin:0 0 3px;font-size:17.5px}
.cause .why{font-size:15px;color:var(--ink-2);margin:0}
.cause .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
.cause .body{padding:0 18px 16px 76px}
.fd{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px dashed var(--line);font-size:15px}
.fd .id{font-family:var(--font-data);font-size:13px;font-weight:700;color:var(--muted)}
.fd .src{font-size:13px;margin-top:4px}
.fd .src a{word-break:break-all}
.pri{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:72px minmax(0,1fr) 200px;gap:14px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:10px}
.prow .when{font-size:14px;font-weight:700;color:var(--accent)}
.prow h3{margin:0 0 3px}
.prow .m{font-size:14.5px;color:var(--muted)}
.prow .r{font-size:13.5px;color:var(--ink-2)}
.next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.next .box h3{display:flex;gap:8px;align-items:center}
form.rec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
form.rec .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--ink-2);font-weight:500;min-width:0}
select,input,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
textarea{min-height:56px;resize:vertical}
button.btn{font:inherit;cursor:pointer;background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:8px 14px;border-radius:6px;border:0}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
button.btn[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13.5px;color:var(--muted);align-self:center}
.mission{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.65;background:var(--soft);border-radius:6px;padding:12px;color:var(--ink-2);white-space:pre-wrap}
.empty{border:1px dashed var(--line-2);border-radius:8px;padding:18px;color:var(--muted);text-align:center;font-size:14.5px}
.srcs{columns:2;column-gap:28px;font-size:14px}
.srcs div{break-inside:avoid;margin-bottom:6px}
.srcs a{word-break:break-all}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 8px;border-radius:4px;z-index:20;max-width:280px}
@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.next,.status3{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:60px minmax(0,1fr)}
  .prow .r{grid-column:2}
  .srcs{columns:1}
}
@media (max-width:560px){
  h1{font-size:24px}
  .claim{grid-template-columns:28px minmax(0,1fr)}
  .claim a.go{grid-column:2}
  .cause .body{padding:0 16px 14px 16px}
  form.rec{grid-template-columns:minmax(0,1fr)}
  .cmp{grid-template-columns:90px minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin:4px 0 12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gap{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:130px minmax(0,1fr) 52px;gap:12px;align-items:center}
.gl{font-size:14.5px;font-weight:500}
.gb{display:flex;flex-direction:column;gap:3px}
.gtrack{height:9px;background:var(--soft);border-radius:0 4px 4px 0}
.gbar{height:100%;border-radius:0 4px 4px 0}
.gbar.lg{background:var(--accent)}.gbar.co{background:#8E8893}.gbar.az{background:#E7B3C4}
.gd{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;color:var(--muted)}
.gd.neg{color:var(--crit)}.gd.pos{color:var(--good)}
table.score td.sc{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;min-width:62px}
td.s1{background:#F6D5D2;color:#7A1A14}td.s2{background:#FBE7E4;color:#8F2A22}td.s3{background:#F6F5F7;color:var(--ink-2)}td.s4{background:#E3F1E8;color:#1D5E37}td.s5{background:#CFE8D8;color:#124A2A}
tr.lg td.sc{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
@media (max-width:560px){.grow{grid-template-columns:96px minmax(0,1fr) 44px}}
.journey{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:j}
.jstage{border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;position:relative}
.jstage:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:18px;color:var(--muted);font-weight:700;background:#fff;padding:0 2px}
.jhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.jk{font-weight:700;color:var(--accent);letter-spacing:.02em}
.jc{color:var(--muted);white-space:nowrap}
.jv{font-size:14.5px;color:var(--ink-2);margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
ul.chk{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:8px}
ul.chk li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:6px;font-size:14.5px;line-height:1.6}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700;margin-top:3px}
.jc .mk{margin:0 3px 0 6px;vertical-align:-3px}
.mk.ok{background:var(--good-soft);color:var(--good)}.mk.part{background:var(--warn-soft);color:var(--warn)}.mk.no{background:var(--crit-soft);color:var(--crit)}
@media (max-width:960px){.journey{grid-template-columns:minmax(0,1fr)}.jstage:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-16px}}
header.top .wrap.sub{padding-block:0 8px}
header.top .wrap.sub:empty,#toc:empty{display:none}
nav.tabs{display:flex;gap:4px;margin-left:8px}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:15px;font-weight:500;padding:8px 14px;border-radius:8px}
nav.tabs a:hover{background:var(--soft)}
nav.tabs a.on{background:var(--ink);color:#fff;font-weight:700}
nav.tabs .cnt{font-size:12px;opacity:.75;margin-left:2px}
nav.toc{overflow-x:auto}
section.hero{padding-block:56px 44px;background:linear-gradient(180deg,var(--accent-soft),#fff 70%)}
section.hero h1{max-width:30ch;font-size:34px}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:4px 0 28px}
.pillar{background:#fff;border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.pillar .pk{font-size:13px;font-weight:700;color:var(--accent)}
.pillar h3{margin:0;font-size:21px}
.pillar .pm{margin:0;font-weight:700;font-size:15.5px}
.pillar .pe{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}
.pillar .pn{margin:6px 0 0;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.herokey{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.herokey p{margin:0;font-size:17px;font-weight:700}
@media (max-width:860px){.pillars{grid-template-columns:minmax(0,1fr)}}
.routes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:8px}
.route{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;transition:border-color .15s,transform .15s}
.route:hover{border-color:var(--accent);transform:translateY(-2px)}
.route .rk{font-size:13px;font-weight:700;color:var(--accent)}
.route b{font-size:16.5px;line-height:1.45}
.route span:last-child{font-size:13.5px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 4px}
.metric{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.metric.new{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mh{display:flex;align-items:center;gap:8px}
.mh b{font-size:17px}
.mn{width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.mq{margin:0;font-weight:500}
.me{margin:0;font-size:14px;color:var(--ink-2);background:var(--soft);border-radius:8px;padding:10px 12px}
.me span,.lab{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:2px}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.side{border-radius:12px;padding:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.side.win{background:var(--good-soft);border-color:#BFDFCB}
.side.lose{background:var(--crit-soft);border-color:#F2C9C4}
.side .sk{font-weight:700;font-size:15px}
.side .row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;font-size:14.5px}
.side .row span{font-weight:700;color:var(--muted);font-size:13px}
.side .row p{margin:0}
.side .big{font-size:22px;font-weight:700;margin-top:auto}
.side.win .big{color:var(--good)}.side.lose .big{color:var(--crit)}
.side .big small{font-size:14px;font-weight:500;color:var(--ink-2)}
.tasks{display:grid;gap:10px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tcard .th{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tcard .th h3{margin:0;font-size:17px}
.tcard .th .note{margin-left:auto}
.tcard .tb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tcard .tb p{margin:0;font-size:14.5px}
table.bu th[scope=row]{background:var(--soft);white-space:nowrap;font-size:13.5px;color:var(--ink);text-transform:none;letter-spacing:0;vertical-align:top}
table.bu td.good{background:var(--good-soft)}
table.bu td.bad{background:#FFF6F5}
ol.pat{margin:16px 0 0;padding-left:22px;display:grid;gap:12px;max-width:80ch}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard header{display:flex;justify-content:space-between;align-items:center}
.bu-tag{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:999px}
.pcard h3{margin:0;font-size:17px}
.pcard h3 a{color:var(--ink);text-decoration:none}
.pcard h3 a:hover{color:var(--accent);text-decoration:underline}
.pc-sec{border-top:1px dashed var(--line);padding-top:8px}
.pc-sec p{margin:0;font-size:14.5px}
.pc-sec.ai{background:var(--soft);border:0;border-radius:8px;padding:10px 12px}
.pc-sec ul.chk{margin:0}
@media (max-width:960px){.routes{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.pcards{grid-template-columns:minmax(0,1fr)}}

</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">Journey Lens <span>UK</span></div>
  <nav class="tabs" id="tabs" aria-label="화면"></nav>
</div><div class="wrap sub"><nav class="toc" id="toc" aria-label="이 화면의 목차"></nav></div></header>

<main id="app"></main>

function render(){
  const keep={};document.querySelectorAll("#s7 [id]").forEach(el=>{if("value" in el&&el.tagName!=="BUTTON")keep[el.id]=el.value});
  const st={g:($("#g_status")||{}).textContent,j:($("#j_status")||{}).textContent};
  const openC=[...document.querySelectorAll("details.cause")].map(d=>d.open);
  const html={frame:()=>secFrameHero()+secF1()+secF2()+secF3()+secF4()+secF4b()+secF5()+secF6(),bu:()=>secBU(),tv:()=>secConclusion()+secReady()+secAI()+secPDP()+secCauses()+secPriority()+secNext()}[VIEW];
  $("#app").innerHTML=html();
  nav();
  if(openC.length)document.querySelectorAll("details.cause").forEach((d,i)=>d.open=openC[i]);
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el&&v!=="")el.value=v});
  if(st.g&&$("#g_status"))$("#g_status").textContent=st.g;if(st.j&&$("#j_status"))$("#j_status").textContent=st.j;

function wire(){
  if(!$("#m_p"))return;
  const upd=()=>{$("#m_text").textContent=MISSIONS[$("#m_p").value].replace("{R}",$("#m_r").value)};upd();
  $("#m_p").onchange=upd;$("#m_r").onchange=upd;
  $("#m_copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#m_text").textContent);$("#m_copy").textContent="복사됨"}catch(e){const r=document.createRange();r.selectNodeContents($("#m_text"));getSelection().removeAllRanges();getSelection().addRange(r)}};
  const today=new Date().toISOString().slice(0,10);
  const gf=$("#geoForm");
  if(gf){if(!$("#g_date").value)$("#g_date").value=today;
    $("#g_copy").onclick=async()=>{const q=QS.find(x=>x.id===$("#g_q").value);try{await navigator.clipboard.writeText(q.q);$("#g_status").textContent="질문을 복사했습니다"}catch(e){$("#g_status").textContent=q.q}};
    gf.onsubmit=async e=>{e.preventDefault();const b=$("#g_save");b.disabled=true;$("#g_status").textContent="저장 중…";
      const d={q:$("#g_q").value,ai:$("#g_ai").value,run:+$("#g_run").value,date:$("#g_date").value,state:$("#g_state").value,cite:$("#g_cite").value,obs:$("#g_obs").value,env:$("#g_env").value.trim(),comp:$("#g_comp").value.trim(),note:$("#g_note").value.trim(),savedAt:new Date().toISOString()};
      try{await DB.collection("geo_obs").doc(`${d.q}_${d.ai}_${d.run}`).set(d);$("#g_status").textContent=`${d.q} · ${d.run}회차를 저장했습니다`;$("#g_comp").value="";$("#g_note").value=""}
      catch(err){$("#g_status").textContent=err&&err.code==="invalid_argument"?"저장 권한이 없습니다":"저장하지 못했습니다. 잠시 후 다시 시도하세요"}
      b.disabled=false}}
  const jf=$("#jForm");
  if(jf){if(!$("#j_date").value)$("#j_date").value=today;
    jf.onsubmit=async e=>{e.preventDefault();const b=$("#j_save");b.disabled=true;$("#j_status").textContent="저장 중…";
      const d={p:$("#m_p").value,r:$("#m_r").value,run:+$("#j_run").value,date:$("#j_date").value,rank:$("#j_rank").value?+$("#j_rank").value:null,stage:$("#j_stage").value,win:$("#j_win").value.trim(),why:$("#j_why").value.trim(),savedAt:new Date().toISOString()};
      try{await DB.collection("journeys").doc(`${d.p}_${d.r.replace(/\s/g,"")}_${d.run}`).set(d);$("#j_status").textContent="저장했습니다"}
      catch(err){$("#j_status").textContent=err&&err.code==="invalid_argument"?"저장 권한이 없습니다":"저장하지 못했습니다"}
      b.disabled=false}}
}
function nav(){
  $("#tabs").innerHTML=Object.entries(VIEWS).map(([k,v])=>`<a href="#${k}" data-v="${k}" class="${k===VIEW?"on":""}"${k===VIEW?' aria-current="page"':""}>${v.label}</a>`).join("");
  $("#toc").innerHTML=VIEWS[VIEW].secs.length>1?VIEWS[VIEW].secs.map(([id,l])=>`<a href="#${VIEW}/${id}" data-s="${id}">${l}</a>`).join(""):"";
}
function route(){
  let h="";try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  let [v,sid]=h.split("/");
  const legacy=Object.entries(VIEWS).find(([k,x])=>x.secs.some(s=>s[0]===v));
  if(legacy){sid=v;v=legacy[0]}
  if(!VIEWS[v])v="frame";
  const changed=v!==VIEW;VIEW=v;
  if(changed||!$("#app").innerHTML)render();else nav();
  observe();
  const el=sid&&document.getElementById(sid);
  if(el){el.scrollIntoView()}else if(changed){window.scrollTo(0,0)}
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const h=a.getAttribute("href");if(h.length<2)return;e.preventDefault();try{history.replaceState(null,"",h)}catch(err){};route()});
window.addEventListener("hashchange",route);
render();
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("on",a.dataset.s===e.target.id))}})},{rootMargin:"-40% 0px -55% 0px"}):null;
function observe(){if(io){io.disconnect();document.querySelectorAll("section").forEach(s=>io.observe(s))}}
route();

</script>

</body>
</html>
